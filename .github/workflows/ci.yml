name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run test:e2e
